<header class="site-header">
    <div class="site-header__inner">
        <a href="/" class="site-logo" aria-label="BABAEI">BABAEI</a>

        <nav class="site-nav" aria-label="منوی اصلی">
            <a href="/">خانه</a>
            <a href="{% url 'shop:index' %}" class="{% if request.resolver_match.namespace == 'shop' %}is-active{% endif %}">فروشگاه</a>
            <a href="{% url 'shop:index' %}">طراحی اختصاصی</a>
            <a href="#">بلاگ</a>
            <a href="#">درباره ما</a>
        </nav>

        <div class="site-actions">
            <button type="button" class="header-icon" aria-label="جستجو">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
            </button>
            <a href="{% url 'users:profile' %}" class="header-icon" aria-label="حساب کاربری">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 21c.8-3.7 3.1-5.5 7-5.5s6.2 1.8 7 5.5"></path></svg>
            </a>
            <a href="{% url 'orders:cart' %}" class="header-icon header-cart" aria-label="سبد خرید">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l1.6 10.2a2 2 0 0 0 2 1.7h7.7a2 2 0 0 0 2-1.6L20 8H7"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
                {% if cart_item_count %}<span class="header-cart__badge">{{ cart_item_count }}</span>{% endif %}
            </a>
        </div>
    </div>
</header>

<nav class="mobile-bottom-nav" aria-label="ناوبری سریع موبایل">
    <a href="/" class="{% if request.resolver_match.namespace == 'home' %}is-active{% endif %}" aria-label="خانه">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
        <span>خانه</span>
    </a>
    <a href="{% url 'shop:index' %}" class="{% if request.resolver_match.namespace == 'shop' %}is-active{% endif %}" aria-label="فروشگاه">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
        <span>فروشگاه</span>
    </a>
    <button type="button" aria-label="جستجو">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
        <span>جستجو</span>
    </button>
    <a href="{% url 'users:profile' %}" class="{% if request.resolver_match.namespace == 'users' %}is-active{% endif %}" aria-label="حساب کاربری">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 21c.8-3.7 3.1-5.5 7-5.5s6.2 1.8 7 5.5"></path></svg>
        <span>حساب</span>
    </a>
    <a href="{% url 'orders:cart' %}" class="{% if request.resolver_match.namespace == 'orders' %}is-active{% endif %}" aria-label="سبد خرید">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l1.6 10.2a2 2 0 0 0 2 1.7h7.7a2 2 0 0 0 2-1.6L20 8H7"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
        <span>سبد{% if cart_item_count %} ({{ cart_item_count }}){% endif %}</span>
    </a>
</nav>

<style>
/* Shop reference navbar — intentionally scoped so Admin, Design Studio and other pages stay untouched. */
body.shop-page .site-header {
    position: sticky !important;
    top: 0 !important;
    z-index: 1500 !important;
    width: 100% !important;
    height: 0 !important;
    min-height: 0 !important;
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    pointer-events: none !important;
}

body.shop-page .site-header__inner {
    position: relative !important;
    width: min(1480px, calc(100% - 72px)) !important;
    height: 78px !important;
    margin: 18px auto 0 !important;
    padding: 0 24px 0 30px !important;
    display: grid !important;
    grid-template-columns: 290px minmax(0, 1fr) 210px !important;
    align-items: center !important;
    gap: 20px !important;
    border-radius: 42px !important;
    background: rgba(248, 246, 240, .91) !important;
    border: 1px solid rgba(255, 255, 255, .78) !important;
    box-shadow:
        0 14px 42px rgba(19, 24, 17, .14),
        0 3px 12px rgba(19, 24, 17, .05),
        inset 0 1px 0 rgba(255, 255, 255, .88) !important;
    backdrop-filter: blur(18px) saturate(115%) !important;
    -webkit-backdrop-filter: blur(18px) saturate(115%) !important;
    pointer-events: auto !important;
    overflow: visible !important;
}

body.shop-page .site-logo {
    position: relative !important;
    z-index: 2 !important;
    width: max-content !important;
    min-width: 245px !important;
    height: 78px !important;
    display: flex !important;
    align-items: center !important;
    padding-left: 16px !important;
    color: #171916 !important;
    text-decoration: none !important;
    font-family: Georgia, "Times New Roman", serif !important;
    font-size: 31px !important;
    font-weight: 500 !important;
    letter-spacing: .22em !important;
    line-height: 1 !important;
}

body.shop-page .site-logo::before {
    content: "" !important;
    position: absolute !important;
    z-index: -1 !important;
    left: -44px !important;
    top: -25px !important;
    width: 285px !important;
    height: 128px !important;
    background: rgba(57, 72, 53, .96) !important;
    border-radius: 0 70% 58% 0 / 0 54% 62% 0 !important;
    transform: rotate(-2deg) !important;
    pointer-events: none !important;
}

body.shop-page .site-logo::after {
    content: "WEAR YOUR STORY" !important;
    position: absolute !important;
    left: 17px !important;
    bottom: 12px !important;
    color: rgba(255, 255, 255, .82) !important;
    font-family: Arial, sans-serif !important;
    font-size: 7px !important;
    font-weight: 600 !important;
    letter-spacing: .34em !important;
    white-space: nowrap !important;
}

body.shop-page .site-nav {
    height: 100% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    direction: rtl !important;
}

body.shop-page .site-nav a {
    position: relative !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    min-height: 44px !important;
    padding: 0 17px !important;
    border-radius: 22px !important;
    color: #252923 !important;
    background: transparent !important;
    text-decoration: none !important;
    font-family: inherit !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    white-space: nowrap !important;
    transition: background .18s ease, color .18s ease !important;
}

body.shop-page .site-nav a:hover {
    background: rgba(232, 226, 215, .62) !important;
    color: #172319 !important;
}

body.shop-page .site-nav a.is-active {
    background: #e9e3d7 !important;
    color: #172319 !important;
}

body.shop-page .site-nav a.is-active::after {
    content: "" !important;
    position: absolute !important;
    left: 50% !important;
    bottom: -9px !important;
    width: 6px !important;
    height: 6px !important;
    border-radius: 50% !important;
    background: #b59668 !important;
    transform: translateX(-50%) !important;
}

body.shop-page .site-actions {
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    gap: 9px !important;
    direction: ltr !important;
}

body.shop-page .site-actions .header-icon {
    position: relative !important;
    width: 43px !important;
    height: 43px !important;
    min-width: 43px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 50% !important;
    background: rgba(255, 255, 255, .54) !important;
    color: #283028 !important;
    text-decoration: none !important;
    box-shadow: inset 0 0 0 1px rgba(29, 38, 29, .08) !important;
    transition: transform .18s ease, background .18s ease !important;
}

body.shop-page .site-actions .header-icon:hover {
    transform: translateY(-1px) !important;
    background: #fffdf8 !important;
}

body.shop-page .site-actions .header-icon svg {
    width: 19px !important;
    height: 19px !important;
    fill: none !important;
    stroke: currentColor !important;
    stroke-width: 1.6 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
}

body.shop-page .site-actions .header-cart {
    background: #203524 !important;
    color: #f7f3ea !important;
    box-shadow: none !important;
}

body.shop-page .site-actions .header-cart:hover {
    background: #29432e !important;
}

body.shop-page .header-cart__badge {
    position: absolute !important;
    top: -4px !important;
    right: -2px !important;
    min-width: 18px !important;
    height: 18px !important;
    padding: 0 5px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 999px !important;
    background: #c6a16b !important;
    color: #fffdf8 !important;
    font: 700 10px/1 Arial, sans-serif !important;
    box-shadow: 0 2px 7px rgba(0, 0, 0, .16) !important;
}

body.shop-page .header-menu-button {
    display: none !important;
}

body.shop-page .mobile-bottom-nav {
    display: none !important;
}

@media (max-width: 1180px) {
    body.shop-page .site-header__inner {
        width: min(94%, 1080px) !important;
        grid-template-columns: 245px minmax(0, 1fr) 185px !important;
        padding-left: 22px !important;
        padding-right: 20px !important;
    }

    body.shop-page .site-logo {
        min-width: 210px !important;
        font-size: 27px !important;
    }

    body.shop-page .site-nav a {
        padding-left: 11px !important;
        padding-right: 11px !important;
        font-size: 13px !important;
    }
}

@media (max-width: 820px) {
    body.shop-page .site-header {
        height: auto !important;
    }

    body.shop-page .site-header__inner {
        width: calc(100% - 24px) !important;
        height: 64px !important;
        margin-top: 10px !important;
        padding: 0 12px 0 18px !important;
        grid-template-columns: 1fr auto !important;
        border-radius: 34px !important;
    }

    body.shop-page .site-logo {
        min-width: 0 !important;
        height: 64px !important;
        font-size: 24px !important;
        padding-left: 8px !important;
    }

    body.shop-page .site-logo::before {
        left: -25px !important;
        top: -25px !important;
        width: 190px !important;
        height: 106px !important;
    }

    body.shop-page .site-logo::after {
        left: 9px !important;
        bottom: 8px !important;
        font-size: 6px !important;
    }

    body.shop-page .site-nav {
        display: none !important;
    }

    body.shop-page .site-actions {
        gap: 6px !important;
    }

    body.shop-page .site-actions .header-icon {
        width: 38px !important;
        height: 38px !important;
        min-width: 38px !important;
    }

    body.shop-page .mobile-bottom-nav {
        display: grid !important;
    }
}
</style>
