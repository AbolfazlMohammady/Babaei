<header class="site-header">
    <div class="site-header__inner">

        <button type="button" class="header-icon header-menu-button" data-mobile-menu aria-label="باز کردن منو" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>

        <a href="/" class="site-logo" aria-label="BABAEI">BABAEI</a>

        <nav class="site-nav" aria-label="منوی اصلی">
            <a href="/">خانه</a>
            <a href="#">فروشگاه</a>
            <a href="#">طراحی اختصاصی</a>
            <a href="#">بلاگ</a>
            <a href="#">درباره ما</a>
        </nav>

        <div class="site-actions">
            <button type="button" class="header-icon" aria-label="جستجو">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
            </button>

            {% if request.user.is_authenticated %}
                <a href="{% url 'users:profile' %}" class="header-icon" aria-label="پروفایل">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 21c.8-3.7 3.1-5.5 7-5.5s6.2 1.8 7 5.5"></path></svg>
                </a>
            {% else %}
                <a href="{% url 'users:login' %}" class="header-icon" aria-label="ورود">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 21c.8-3.7 3.1-5.5 7-5.5s6.2 1.8 7 5.5"></path></svg>
                </a>
            {% endif %}

            <a href="#" class="header-icon header-cart" aria-label="سبد خرید">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l1.6 10.2a2 2 0 0 0 2 1.7h7.7a2 2 0 0 0 2-1.6L20 8H7"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
                <span class="header-cart__badge">0</span>
            </a>
        </div>
    </div>
</header>

<style>
.home-page .categories{padding:54px 0 58px;background:#fff}
.home-page .categories .section-header{width:min(calc(100% - 56px),1240px);margin:0 auto 24px}
.home-page .categories .section-header h2{font-size:clamp(22px,2vw,30px);line-height:1.2}
.home-page .categories__grid{width:min(calc(100% - 56px),1240px);grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.home-page .category-card__image{aspect-ratio:1/1;border-radius:5px;background:#f2f2f0}
.home-page .category-card__image img{object-fit:contain;transform:none}
.home-page .category-card:hover .category-card__image img{transform:scale(1.015)}
.home-page .category-card h3{margin:9px 0 2px;font-size:13px;font-weight:600}
.home-page .category-card span{font-size:9px;color:#888}

.home-page .feature-banner{direction:ltr;grid-template-columns:repeat(2,minmax(0,1fr))}
.home-page .feature-banner__item{aspect-ratio:1.5/1;min-height:0;position:relative}
.home-page .feature-banner__item>img{object-fit:cover}
.home-page .feature-banner__item:first-child .feature-banner__overlay{background:linear-gradient(90deg,rgba(0,0,0,.58) 0%,rgba(0,0,0,.28) 58%,rgba(0,0,0,.10) 100%)}
.home-page .feature-banner__content{position:absolute;inset:0 auto 0 0;width:58%;min-height:0;height:100%;padding:44px;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;direction:rtl;text-align:right}
.home-page .feature-banner__content h2{max-width:100%;margin:0 0 13px;font-size:clamp(27px,3vw,44px);line-height:1.12}
.home-page .feature-banner__content p{max-width:100%;font-size:11px;line-height:1.9}
.home-page .feature-banner__content .button{margin-top:17px;min-height:42px;padding-inline:20px;font-size:11px}
.home-page .feature-banner__content--dark{color:#111}
.home-page .feature-banner__content--dark a{color:#111;font-size:11px}

@media (max-width:900px){
 .home-page .categories{padding:42px 0 48px}
 .home-page .categories .section-header,.home-page .categories__grid{width:calc(100% - 28px)}
 .home-page .categories__grid{gap:10px}
 .home-page .category-card__image{aspect-ratio:1/1.03}
 .home-page .feature-banner{grid-template-columns:1fr}
 .home-page .feature-banner__item{aspect-ratio:1.45/1}
 .home-page .feature-banner__content{width:68%;padding:28px 22px}
 .home-page .feature-banner__content h2{font-size:29px}
}
</style>
